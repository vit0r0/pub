<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Летний Кемпинг 🏕️</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            background: linear-gradient(180deg, #050d1a 0%, #0a192f 40%, #0d233a 70%, #152d24 100%);
            background-attachment: fixed;
            color: #f0f4f8;
            position: relative;
            overflow-x: hidden;
            padding: 20px 12px 100px 12px;
        }

        #night-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            position: relative;
            z-index: 10;
        }

        .header {
            text-align: center;
            margin-top: 10px;
            margin-bottom: 15px;
        }

        .header h1 {
            font-family: 'Caveat', cursive;
            font-size: 2.8rem;
            color: #ffd166;
            text-shadow: 0 0 15px rgba(255, 209, 102, 0.6), 0 0 30px rgba(255, 107, 107, 0.4);
            letter-spacing: 1px;
            line-height: 1.1;
        }

        .header p {
            font-size: 0.85rem;
            color: #a8dadc;
            margin-top: 6px;
            font-weight: 600;
        }

        .sync-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(6, 214, 160, 0.15);
            border: 1px solid rgba(6, 214, 160, 0.4);
            color: #06d6a0;
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 12px;
            margin-top: 8px;
            font-weight: 700;
        }

        .sync-dot {
            width: 8px;
            height: 8px;
            background-color: #06d6a0;
            border-radius: 50%;
            box-shadow: 0 0 8px #06d6a0;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.4; transform: scale(0.9); }
            50% { opacity: 1; transform: scale(1.1); }
            100% { opacity: 0.4; transform: scale(0.9); }
        }

        .camp-scene {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 20px;
            height: 80px;
            margin-bottom: 20px;
            position: relative;
        }

        .guitar-wrap {
            font-size: 3rem;
            animation: guitarRock 3s infinite ease-in-out;
            transform-origin: bottom center;
            filter: drop-shadow(0 0 10px rgba(255, 209, 102, 0.3));
        }

        @keyframes guitarRock {
            0%, 100% { transform: rotate(-5deg); }
            50% { transform: rotate(8deg) translateY(-4px); }
        }

        .campfire {
            position: relative;
            width: 60px;
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        .logs {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 14px;
        }

        .log {
            position: absolute;
            width: 45px;
            height: 9px;
            background: #5c3d2e;
            border-radius: 5px;
            border: 1px solid #3d2314;
        }
        .log.l1 { transform: rotate(15deg); left: 5px; }
        .log.l2 { transform: rotate(-15deg); right: 5px; }

        .flame {
            position: absolute;
            bottom: 8px;
            border-radius: 50% 50% 20% 20%;
            transform-origin: center bottom;
            animation: flicker 0.15s infinite alternate ease-in-out;
        }

        .flame.f1 {
            width: 38px;
            height: 48px;
            background: radial-gradient(circle, #ff4500 20%, #ff8c00 70%, transparent 100%);
            box-shadow: 0 0 20px #ff4500, 0 0 40px #ff8c00;
        }

        .flame.f2 {
            width: 24px;
            height: 32px;
            background: radial-gradient(circle, #ffe600 30%, #ff8c00 80%);
            animation-duration: 0.1s;
        }

        .flame.f3 {
            width: 12px;
            height: 18px;
            background: #ffffff;
            animation-duration: 0.08s;
        }

        @keyframes flicker {
            0% { transform: scale(1) rotate(-2deg); opacity: 0.95; }
            100% { transform: scale(1.08, 1.12) rotate(2deg); opacity: 1; }
        }

        .card {
            background: rgba(13, 35, 58, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 20px;
            padding: 18px 14px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .input-box {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 16px;
            background: rgba(255, 255, 255, 0.05);
            padding: 12px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .input-row {
            display: flex;
            gap: 8px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            font-size: 0.9rem;
            font-family: inherit;
            outline: none;
            background: rgba(10, 25, 47, 0.8);
            color: #ffffff;
        }

        input[type="text"]::placeholder {
            color: #8892b0;
        }

        input[type="text"]:focus {
            border-color: #ffd166;
        }

        .btn-add {
            background: linear-gradient(135deg, #ff9f1c 0%, #ffbf69 100%);
            color: #050d1a;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 0.95rem;
            cursor: pointer;
            width: 100%;
        }

        .progress-box {
            background: rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 10px 14px;
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            font-weight: 700;
            color: #ffd166;
        }

        .progress-bar-bg {
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff9f1c, #06d6a0);
            border-radius: 10px;
            transition: width 0.4s ease;
        }

        .filter-tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 14px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .tab {
            padding: 6px 12px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            font-size: 0.75rem;
            font-weight: 700;
            color: #a8dadc;
            white-space: nowrap;
            cursor: pointer;
        }

        .tab.active {
            background: #ffd166;
            color: #050d1a;
            border-color: #ffd166;
        }

        .item-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .item-card {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .item-card.completed {
            background: rgba(6, 214, 160, 0.08);
            border-color: rgba(6, 214, 160, 0.25);
            opacity: 0.7;
        }

        .reorder-btns {
            display: flex;
            flex-direction: column;
            gap: 2px;
            flex-shrink: 0;
        }

        .btn-move {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #a8dadc;
            font-size: 0.65rem;
            width: 20px;
            height: 18px;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }

        .btn-move:active {
            background: #ffd166;
            color: #050d1a;
        }

        .item-left {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            min-width: 0;
            cursor: pointer;
        }

        .checkbox {
            width: 22px;
            height: 22px;
            border: 2px solid #ffd166;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .item-card.completed .checkbox {
            background: #06d6a0;
            border-color: #06d6a0;
        }

        .checkbox::after {
            content: '✓';
            color: #050d1a;
            font-weight: 900;
            font-size: 13px;
            display: none;
        }

        .item-card.completed .checkbox::after {
            display: block;
        }

        .item-text {
            font-size: 0.9rem;
            font-weight: 600;
            color: #ffffff;
            word-break: break-word;
        }

        .item-card.completed .item-text {
            text-decoration: line-through;
            color: #8892b0;
        }

        .badge {
            padding: 4px 8px;
            border-radius: 10px;
            font-size: 0.75rem;
            font-weight: 700;
            white-space: nowrap;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .badge:active {
            transform: scale(0.95);
        }

        .badge-person {
            background: rgba(255, 209, 102, 0.15);
            color: #ffd166;
            border: 1px solid rgba(255, 209, 102, 0.4);
        }

        .badge-none {
            background: rgba(255, 107, 107, 0.15);
            color: #ff6b6b;
            border: 1px solid rgba(255, 107, 107, 0.4);
        }

        .btn-delete {
            background: none;
            border: none;
            color: #ff6b6b;
            font-size: 1.1rem;
            cursor: pointer;
            padding: 2px 4px;
        }

        /* Modal styling for editing names */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(5px);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-body {
            background: #0d233a;
            border: 1px solid rgba(255, 209, 102, 0.3);
            border-radius: 18px;
            padding: 20px;
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        .modal-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #ffd166;
            text-align: center;
        }

        .quick-names {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
        }

        .name-chip {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 0.8rem;
            color: #a8dadc;
            cursor: pointer;
            font-weight: 600;
        }

        .name-chip:active {
            background: #ffd166;
            color: #050d1a;
        }

        .modal-actions {
            display: flex;
            gap: 8px;
            margin-top: 5px;
        }

        .btn-modal {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            border: none;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .btn-modal.save {
            background: #06d6a0;
            color: #050d1a;
        }

        .btn-modal.clear {
            background: rgba(255, 107, 107, 0.2);
            color: #ff6b6b;
            border: 1px solid rgba(255, 107, 107, 0.3);
        }

        .btn-modal.cancel {
            background: rgba(255, 255, 255, 0.1);
            color: #a8dadc;
        }
    </style>
</head>
<body>

    <canvas id="night-canvas"></canvas>

    <div class="container">
        <div class="header">
            <h1>🔥 Поход на Кемпинг 🏕️</h1>
            <p>Общий чек-лист группы</p>
            <div class="sync-badge">
                <div class="sync-dot"></div>
                <span id="syncStatus">Подключение к Firebase...</span>
            </div>
        </div>

        <div class="camp-scene">
            <div class="guitar-wrap">🎸</div>
            <div class="campfire">
                <div class="logs">
                    <div class="log l1"></div>
                    <div class="log l2"></div>
                </div>
                <div class="flame f1"></div>
                <div class="flame f2"></div>
                <div class="flame f3"></div>
            </div>
        </div>

        <div class="card">
            <div class="input-box">
                <input type="text" id="itemInput" placeholder="Что нужно взять?">
                <div class="input-row">
                    <input type="text" id="nameInput" placeholder="Кто берет?">
                    <button class="btn-add" onclick="addItem()">+ Добавить</button>
                </div>
            </div>

            <div class="progress-box">
                <div class="progress-info">
                    <span>Собрано вещей:</span>
                    <span id="progressText">0 / 0</span>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="progressFill"></div>
                </div>
            </div>

            <div class="filter-tabs">
                <div class="tab active" onclick="setFilter('all', this)">Все вещи</div>
                <div class="tab" onclick="setFilter('pending', this)">Нужно собрать</div>
                <div class="tab" onclick="setFilter('done', this)">Уже собрано</div>
            </div>

            <ul class="item-list" id="itemList"></ul>
        </div>
    </div>

    <!-- Modal for Editing Responsible Name -->
    <div class="modal-overlay" id="editModal">
        <div class="modal-body">
            <div class="modal-title" id="modalItemTitle">Назначить ответственного</div>
            
            <div style="font-size: 0.8rem; color: #a8dadc; text-align: center;">Быстрый выбор участника:</div>
            <div class="quick-names">
                <span class="name-chip" onclick="selectQuickName('Вова')">Вова</span>
                <span class="name-chip" onclick="selectQuickName('Верон')">Верон</span>
                <span class="name-chip" onclick="selectQuickName('Витя')">Витя</span>
                <span class="name-chip" onclick="selectQuickName('Аня')">Аня</span>
                <span class="name-chip" onclick="selectQuickName('Леша')">Леша</span>
                <span class="name-chip" onclick="selectQuickName('Руся')">Руся</span>
                <span class="name-chip" onclick="selectQuickName('Маша')">Маша</span>
            </div>

            <div style="font-size: 0.8rem; color: #a8dadc; text-align: center; margin-top: 4px;">Или добавьте / измените имя:</div>
            <input type="text" id="modalNameInput" placeholder="Имя (например: Вова + Леша)">

            <div class="modal-actions">
                <button class="btn-modal clear" onclick="clearName()">Сбросить</button>
                <button class="btn-modal cancel" onclick="closeModal()">Отмена</button>
                <button class="btn-modal save" onclick="saveName()">Сохранить</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK (v9 Compat mode) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <script>
        // Canvas Animation
        const canvas = document.getElementById('night-canvas');
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        const stars = [];
        for (let i = 0; i < 50; i++) {
            stars.push({ x: Math.random() * width, y: Math.random() * height * 0.7, size: Math.random() * 1.5, alpha: Math.random() });
        }

        const fireflies = [];
        for (let i = 0; i < 30; i++) {
            fireflies.push({
                x: Math.random() * width,
                y: Math.random() * height,
                radius: Math.random() * 2 + 1,
                vx: (Math.random() - 0.5) * 0.6,
                vy: (Math.random() - 0.5) * 0.6,
                alpha: Math.random(),
                pulse: Math.random() * 0.03 + 0.01
            });
        }

        function drawNight() {
            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = '#ffffff';
            stars.forEach(s => {
                ctx.globalAlpha = s.alpha;
                ctx.fillRect(s.x, s.y, s.size, s.size);
            });

            fireflies.forEach(f => {
                f.x += f.vx;
                f.y += f.vy;
                if (f.x < 0 || f.x > width) f.vx *= -1;
                if (f.y < 0 || f.y > height) f.vy *= -1;
                f.alpha += f.pulse;
                if (f.alpha > 1 || f.alpha < 0.2) f.pulse *= -1;

                ctx.globalAlpha = Math.max(0, Math.min(1, f.alpha));
                ctx.beginPath();
                ctx.arc(f.x, f.y, f.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#ffd166';
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#ffd166';
                ctx.fill();
                ctx.shadowBlur = 0;
            });
            requestAnimationFrame(drawNight);
        }
        drawNight();

        // --- FIREBASE CONFIGURATION ---
        const firebaseConfig = {
            apiKey: "AIzaSyC6qT5vyGXr48TwGwa76ev65UjDZ5nWn54",
            authDomain: "camping-2027.firebaseapp.com",
            databaseURL: "https://camping-2027-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "camping-2027",
            storageBucket: "camping-2027.firebasestorage.app",
            messagingSenderId: "441053727767",
            appId: "1:441053727767:web:61800e6a7d53a27182e052",
            measurementId: "G-9P04VB75SP"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const defaultItems = [
            { text: "Зарядная станция от Темы", takenBy: "Вова", done: false },
            { text: "Походная плита", takenBy: "Верон", done: false },
            { text: "Wasserkocher для каши", takenBy: "Витя", done: false },
            { text: "Гриль кастрюля", takenBy: "Аня", done: false },
            { text: "Гриль чемодан", takenBy: "Витя", done: false },
            { text: "Гитара", takenBy: "Леша / Вова", done: false },
            { text: "Походная посуда", takenBy: "Каждый сам себе", done: false },
            { text: "Сковородка", takenBy: "", done: false },
            { text: "Кастрюля маленькая", takenBy: "", done: false },
            { text: "Küchenrollen", takenBy: "", done: false },
            { text: "Müllsäcke", takenBy: "", done: false },
            { text: "Чай", takenBy: "", done: false },
            { text: "Кофе", takenBy: "", done: false },
            { text: "Молоко / сливки", takenBy: "", done: false },
            { text: "Хлеб", takenBy: "", done: false },
            { text: "Помидоры", takenBy: "", done: false },
            { text: "Огурцы", takenBy: "", done: false },
            { text: "Оливки", takenBy: "", done: false },
            { text: "Сметана", takenBy: "", done: false },
            { text: "Мясо для гриля (на 2 вечера)", takenBy: "", done: false },
            { text: "Колбаса", takenBy: "", done: false },
            { text: "Сыр", takenBy: "", done: false },
            { text: "Маргарин / масло", takenBy: "", done: false },
            { text: "Бухло / пиво", takenBy: "", done: false },
            { text: "Кола", takenBy: "", done: false },
            { text: "Семечки", takenBy: "", done: false },
            { text: "Вода", takenBy: "", done: false },
            { text: "Пачка макарон или 2 кг картошки", takenBy: "", done: false },
            { text: "Угли", takenBy: "", done: false }
        ];

        let items = defaultItems;
        let currentFilter = 'all';
        let editingIndex = null;

        // Real-time synchronization listener
        db.ref('camping_checklist').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                items = data;
                renderItems();
            } else {
                db.ref('camping_checklist').set(defaultItems);
            }
            document.getElementById('syncStatus').innerText = "Онлайн (Синхронизировано)";
        });

        function saveState() {
            db.ref('camping_checklist').set(items);
            renderItems();
        }

        function renderItems() {
            const list = document.getElementById('itemList');
            list.innerHTML = '';
            let completedCount = 0;

            items.forEach((item, index) => {
                if (item.done) completedCount++;

                if (currentFilter === 'pending' && item.done) return;
                if (currentFilter === 'done' && !item.done) return;

                const li = document.createElement('li');
                li.className = `item-card ${item.done ? 'completed' : ''}`;

                const badge = item.takenBy 
                    ? `<span class="badge badge-person" onclick="openModal(${index})">👤 ${item.takenBy}</span>`
                    : `<span class="badge badge-none" onclick="openModal(${index})">❓ Назначить</span>`;

                const showReorder = currentFilter === 'all';
                const reorderHTML = showReorder ? `
                    <div class="reorder-btns">
                        <button class="btn-move" onclick="moveItem(${index}, -1)">▲</button>
                        <button class="btn-move" onclick="moveItem(${index}, 1)">▼</button>
                    </div>
                ` : '';

                li.innerHTML = `
                    ${reorderHTML}
                    <div class="item-left" onclick="toggleDone(${index})">
                        <div class="checkbox"></div>
                        <span class="item-text">${item.text}</span>
                    </div>
                    <div style="display: flex; align-items: center; gap: 8px;">
                        ${badge}
                        <button class="btn-delete" onclick="deleteItem(${index})">✕</button>
                    </div>
                `;

                list.appendChild(li);
            });

            const total = items.length;
            const percent = total > 0 ? Math.round((completedCount / total) * 100) : 0;
            document.getElementById('progressText').innerText = `${completedCount} из ${total} (${percent}%)`;
            document.getElementById('progressFill').style.width = `${percent}%`;
        }

        function moveItem(index, direction) {
            const targetIndex = index + direction;
            if (targetIndex < 0 || targetIndex >= items.length) return;
            
            const temp = items[index];
            items[index] = items[targetIndex];
            items[targetIndex] = temp;
            
            saveState();
        }

        function addItem() {
            const itemInput = document.getElementById('itemInput');
            const nameInput = document.getElementById('nameInput');
            const itemText = itemInput.value.trim();
            const nameText = nameInput.value.trim();

            if (!itemText) return;

            items.push({ text: itemText, takenBy: nameText, done: false });
            itemInput.value = '';
            nameInput.value = '';
            saveState();
        }

        function toggleDone(index) {
            items[index].done = !items[index].done;
            saveState();
        }

        function deleteItem(index) {
            items.splice(index, 1);
            saveState();
        }

        function setFilter(filter, tabEl) {
            currentFilter = filter;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            tabEl.classList.add('active');
            renderItems();
        }

        // Modal Functions
        function openModal(index) {
            editingIndex = index;
            const item = items[index];
            document.getElementById('modalItemTitle').innerText = `«${item.text}»`;
            document.getElementById('modalNameInput').value = item.takenBy || '';
            document.getElementById('editModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('editModal').classList.remove('active');
            editingIndex = null;
        }

        function selectQuickName(name) {
            const input = document.getElementById('modalNameInput');
            const currentVal = input.value.trim();
            if (currentVal) {
                if (!currentVal.includes(name)) {
                    input.value = `${currentVal}, ${name}`;
                }
            } else {
                input.value = name;
            }
        }

        function saveName() {
            if (editingIndex !== null) {
                const newName = document.getElementById('modalNameInput').value.trim();
                items[editingIndex].takenBy = newName;
                saveState();
            }
            closeModal();
        }

        function clearName() {
            document.getElementById('modalNameInput').value = '';
        }
    </script>
</body>
</html>
